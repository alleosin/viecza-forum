{% extends 'forum/base.html' %}

{% block content %}
    {% for post in posts %}
        <div class="post">
            <h1><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h1>
            <div class="author">
                {{ post.author }}
            </div>
            <div class="date">
                <p>Апублікавана: {{ post.created_date|date:"d-m-Y у H:i" }}</p>
            </div>
            {% if post.image %}
                <img class="card-img-top" src="{{ MEDIA_URL }}{{ post.image }}" alt="" height="206">
            {% endif %}
            <div class="text">
                {{ post.text|linebreaksbr }}
            </div>
        </div>
    {% endfor %}
{% endblock %}
